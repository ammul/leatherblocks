plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_plugin_version}"
}

version = mod_version
group = 'de.cedric.leatherblocks'
base { archivesName = 'leatherblocks' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        leatherblocks {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Modid-Platzhalter waeren hier moeglich - die Mod nutzt bewusst statische
// Ressourcen, damit sie ohne runData baubar ist.
